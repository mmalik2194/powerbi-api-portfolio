<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F1F5F9"/><rect width="1920" height="205" fill="#102B43"/><text x="80" y="65" font-family="Segoe UI, Arial" font-size="25" font-weight="600" fill="#86CED0">POWER APPS / ACCEPTANCE PLAN</text><text x="80" y="139" font-family="Segoe UI, Arial" font-size="52" font-weight="600" fill="#FFFFFF">Build and verify in a Microsoft tenant</text><text x="80" y="1030" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#62778B">Implementation checklist • these are planned tenant acceptance checks, not claimed completed results</text><rect x="80" y="285" width="560" height="470" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="112" y="342" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">Provision lists</text><text x="112" y="397" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">Create Airports and Inspections</text><text x="112" y="440" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">with the exact field names and</text><text x="112" y="483" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">types in sharepoint_schema.json.</text><rect x="680" y="285" width="560" height="470" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="712" y="342" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">Assemble screens</text><text x="712" y="397" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">Use scrHome, scrAirport,</text><text x="712" y="440" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">scrNewInspection and</text><text x="712" y="483" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">scrInspection with the supplied</text><text x="712" y="526" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">named controls.</text><rect x="1280" y="285" width="560" height="470" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="1312" y="342" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">Test writes and closure</text><text x="1312" y="397" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">Check required fields,</text><text x="1312" y="440" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">permission errors, due dates and</text><text x="1312" y="483" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">resolution notes before</text><text x="1312" y="526" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">publishing.</text><text x="85" y="850" font-family="Segoe UI, Arial" font-size="31" font-weight="400" fill="#536B80">Synthetic inspection requests demonstrate the workflow. They do not assert that the selected airports</text><text x="85" y="895" font-family="Segoe UI, Arial" font-size="31" font-weight="400" fill="#536B80">have actual defects.</text></svg>