<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F1F5F9"/><rect width="1920" height="205" fill="#102B43"/><text x="80" y="65" font-family="Segoe UI, Arial" font-size="25" font-weight="600" fill="#86CED0">PYTHON DRY RUN / SOURCE-BASED EXPLANATION</text><text x="80" y="139" font-family="Segoe UI, Arial" font-size="52" font-weight="600" fill="#FFFFFF">Reminder selection logic</text><text x="80" y="1030" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#62778B">Local simulator • fixed demonstration timestamp • no network writes or email delivery</text><rect x="80" y="265" width="1140" height="600" rx="20" fill="#132E46" stroke="#132E46"/><text x="114" y="315" xml:space="preserve" font-family="Consolas" font-size="26" fill="#D8EEF2">def eligible(row, now):</text><text x="114" y="356" xml:space="preserve" font-family="Consolas" font-size="26" fill="#D8EEF2">    if row[&quot;Status&quot;] == &quot;Closed&quot;:</text><text x="114" y="397" xml:space="preserve" font-family="Consolas" font-size="26" fill="#D8EEF2">        return False</text><text x="114" y="438" xml:space="preserve" font-family="Consolas" font-size="26" fill="#D8EEF2">    if not row.get(&quot;DueAt&quot;):</text><text x="114" y="479" xml:space="preserve" font-family="Consolas" font-size="26" fill="#D8EEF2">        return False</text><text x="114" y="520" xml:space="preserve" font-family="Consolas" font-size="26" fill="#D8EEF2">    due = parse_timezone_aware_due_date(row)</text><text x="114" y="561" xml:space="preserve" font-family="Consolas" font-size="26" fill="#D8EEF2">    today = now.strftime(&quot;%Y-%m-%d&quot;)</text><text x="114" y="602" xml:space="preserve" font-family="Consolas" font-size="26" fill="#D8EEF2">    return (due &lt; now and</text><text x="114" y="643" xml:space="preserve" font-family="Consolas" font-size="26" fill="#D8EEF2">            row.get(&quot;LastReminderDate&quot;, &quot;&quot;) != today)</text><text x="114" y="684" xml:space="preserve" font-family="Consolas" font-size="26" fill="#D8EEF2"></text><text x="114" y="725" xml:space="preserve" font-family="Consolas" font-size="26" fill="#D8EEF2"># Abbreviated for explanation.</text><text x="114" y="766" xml:space="preserve" font-family="Consolas" font-size="26" fill="#D8EEF2"># Full executable code: simulate.py</text><rect x="1260" y="265" width="580" height="270" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="1292" y="322" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">Strict due-time boundary</text><text x="1292" y="377" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">A request due exactly at the</text><text x="1292" y="420" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">captured run time is not yet</text><text x="1292" y="463" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">overdue.</text><rect x="1260" y="570" width="580" height="295" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="1292" y="627" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">UTC reminder stamp</text><text x="1292" y="682" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">A successful reminder excludes the</text><text x="1292" y="725" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">item from later runs on the same</text><text x="1292" y="768" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">UTC date.</text></svg>