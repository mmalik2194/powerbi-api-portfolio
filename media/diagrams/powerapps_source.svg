<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F1F5F9"/><rect width="1920" height="205" fill="#102B43"/><text x="80" y="65" font-family="Segoe UI, Arial" font-size="25" font-weight="600" fill="#86CED0">POWER FX / ABBREVIATED LOGIC ILLUSTRATION</text><text x="80" y="139" font-family="Segoe UI, Arial" font-size="52" font-weight="600" fill="#FFFFFF">Create records with validation</text><text x="80" y="1030" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#62778B">Abbreviated logic • use the full PowerFx.fx implementation • native tenant execution remains pending</text><rect x="80" y="260" width="1140" height="645" rx="20" fill="#132E46" stroke="#132E46"/><text x="114" y="302" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">If(IsBlank(Trim(txtIssue.Text)) ||</text><text x="114" y="339" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">   !IsMatch(Trim(txtOwner.Text), Match.Email),</text><text x="114" y="376" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">   Notify(&quot;Enter an issue and valid owner email.&quot;,</text><text x="114" y="413" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">          NotificationType.Error),</text><text x="114" y="450" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">   IfError(</text><text x="114" y="487" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">     With({saved: Patch(Inspections,</text><text x="114" y="524" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">       Defaults(Inspections), {</text><text x="114" y="561" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">         AirportIdent: varAirport.Title,</text><text x="114" y="598" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">         Status: &quot;Open&quot;,</text><text x="114" y="635" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">         OwnerEmail: Trim(txtOwner.Text)</text><text x="114" y="672" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">       })}, /* success handling */),</text><text x="114" y="709" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">     Notify(FirstError.Message,</text><text x="114" y="746" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">            NotificationType.Error)</text><text x="114" y="783" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">   )</text><text x="114" y="820" xml:space="preserve" font-family="Consolas" font-size="25" fill="#D8EEF2">)</text><rect x="1260" y="260" width="580" height="290" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="1292" y="317" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">Input checks</text><text x="1292" y="372" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">Issue description and valid owner</text><text x="1292" y="415" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">email are required before creating</text><text x="1292" y="458" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">a record.</text><rect x="1260" y="585" width="580" height="320" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="1292" y="642" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">Error handling</text><text x="1292" y="697" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">The full PowerFx.fx file maps each</text><text x="1292" y="740" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">formula to its control property.</text><text x="1292" y="783" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">It includes explicit success and</text><text x="1292" y="826" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">failure handling.</text></svg>