<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F1F5F9"/><rect width="1920" height="205" fill="#102B43"/><text x="80" y="65" font-family="Segoe UI, Arial" font-size="25" font-weight="600" fill="#86CED0">POWER APPS / CONCEPTUAL ARCHITECTURE</text><text x="80" y="139" font-family="Segoe UI, Arial" font-size="52" font-weight="600" fill="#FFFFFF">Asset-to-inspection workflow</text><text x="80" y="1030" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#62778B">Architecture diagram from the source kit • not a screenshot of a deployed app</text><rect x="80" y="285" width="415" height="310" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="112" y="342" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">01 / Browse assets</text><text x="112" y="397" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">Search airport names</text><text x="112" y="440" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">with delegated</text><text x="112" y="483" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">StartsWith filtering.</text><text x="505" y="455" font-family="Segoe UI, Arial" font-size="36" font-weight="600" fill="#177F8A">→</text><rect x="535" y="285" width="415" height="310" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="567" y="342" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">02 / Record issue</text><text x="567" y="397" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">Choose priority,</text><text x="567" y="440" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">describe the issue and</text><text x="567" y="483" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">assign a valid owner</text><text x="567" y="526" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">email.</text><text x="960" y="455" font-family="Segoe UI, Arial" font-size="36" font-weight="600" fill="#177F8A">→</text><rect x="990" y="285" width="415" height="310" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="1022" y="342" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">03 / Work the issue</text><text x="1022" y="397" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">Track Open and In</text><text x="1022" y="440" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">progress states against</text><text x="1022" y="483" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">a due date.</text><text x="1415" y="455" font-family="Segoe UI, Arial" font-size="36" font-weight="600" fill="#177F8A">→</text><rect x="1445" y="285" width="415" height="310" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="1477" y="342" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">04 / Resolve</text><text x="1477" y="397" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">Require resolution notes</text><text x="1477" y="440" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">before the record can be</text><text x="1477" y="483" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">closed.</text><rect x="80" y="665" width="850" height="260" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="112" y="722" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">SharePoint master / Airports</text><text x="112" y="777" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">Title, AirportName, AirportType, Region, Latitude</text><text x="112" y="820" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">and Longitude. Original asset values stay separate</text><text x="112" y="863" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">from requests.</text><rect x="965" y="665" width="875" height="260" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="997" y="722" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">SharePoint detail / Inspections</text><text x="997" y="777" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">AirportIdent links the request to its asset.</text><text x="997" y="820" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">Status, DueAt, OwnerEmail and ResolutionNotes</text><text x="997" y="863" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">describe the workflow.</text></svg>