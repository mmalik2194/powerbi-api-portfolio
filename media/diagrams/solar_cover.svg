<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F1F5F9"/><rect width="1920" height="205" fill="#102B43"/><text x="80" y="65" font-family="Segoe UI, Arial" font-size="25" font-weight="600" fill="#86CED0">POWER BI / NASA POWER API</text><text x="80" y="139" font-family="Segoe UI, Arial" font-size="52" font-weight="600" fill="#FFFFFF">Solar Resource &amp; Weather Intelligence</text><text x="80" y="1030" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#62778B">Captioned screenshot walkthrough • native Power BI Desktop captures • modeled energy scenario</text><rect x="80" y="285" width="560" height="440" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="112" y="342" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">Five Australian cities</text><text x="112" y="397" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">Daily solar resource and weather</text><text x="112" y="440" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">estimates for 2020–2025.</text><rect x="680" y="285" width="560" height="440" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="712" y="342" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">26 DAX measures</text><text x="712" y="397" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">What-if capacity and performance</text><text x="712" y="440" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">ratio, rolling windows, YoY/YTD</text><text x="712" y="483" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">and anomalies.</text><rect x="1280" y="285" width="560" height="440" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="1312" y="342" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">Transparent scenario</text><text x="1312" y="397" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">Modeled energy, not metered</text><text x="1312" y="440" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">generation. Assumptions and</text><text x="1312" y="483" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">completeness are documented.</text><text x="84" y="840" font-family="Segoe UI, Arial" font-size="30" font-weight="600" fill="#20384D">Personal portfolio project • public data • documented assumptions</text></svg>