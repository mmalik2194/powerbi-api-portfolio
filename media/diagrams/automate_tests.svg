<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#F1F5F9"/><rect width="1920" height="205" fill="#102B43"/><text x="80" y="65" font-family="Segoe UI, Arial" font-size="25" font-weight="600" fill="#86CED0">POWER AUTOMATE SIMULATOR / VERIFICATION</text><text x="80" y="139" font-family="Segoe UI, Arial" font-size="52" font-weight="600" fill="#FFFFFF">Tested local behavior</text><text x="80" y="1030" font-family="Segoe UI, Arial" font-size="23" font-weight="400" fill="#62778B">Nine local tests passed • cloud connectors, message delivery and tenant updates remain untested</text><rect x="80" y="270" width="560" height="520" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="112" y="327" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">9 passing tests</text><text x="112" y="382" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">Overdue, closed, future, exact</text><text x="112" y="425" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">due boundary, same-day reminder,</text><text x="112" y="468" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">old reminder, missing due date,</text><text x="112" y="511" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">time-zone offset and timezone-</text><text x="112" y="554" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">free input rejection.</text><rect x="680" y="270" width="560" height="520" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="712" y="327" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">4 eligible demo issues</text><text x="712" y="382" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">At 1 November 2026, 00:00 UTC,</text><text x="712" y="425" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">the supplied synthetic dataset</text><text x="712" y="468" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">selects DEMO-001, DEMO-002,</text><text x="712" y="511" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">DEMO-004 and DEMO-005.</text><rect x="1280" y="270" width="560" height="520" rx="20" fill="#FFFFFF" stroke="#DBE4ED"/><text x="1312" y="327" font-family="Segoe UI, Arial" font-size="32" font-weight="600" fill="#177F8A">Reproduce the result</text><text x="1312" y="382" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">python -m unittest</text><text x="1312" y="425" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">python simulate.py</text><text x="1312" y="468" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80"></text><text x="1312" y="511" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">Run from the automation folder.</text><text x="1312" y="554" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">No Microsoft credentials are</text><text x="1312" y="597" font-family="Segoe UI, Arial" font-size="28" font-weight="400" fill="#536B80">needed for these local checks.</text><text x="85" y="880" font-family="Segoe UI, Arial" font-size="30" font-weight="600" fill="#20384D">Dry-run result only. No emails were sent and no SharePoint records were changed.</text></svg>